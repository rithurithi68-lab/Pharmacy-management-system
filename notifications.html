<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediStock Pro - Notifications</title>

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #f9fafb;
      font-family: 'Poppins', sans-serif;
      margin: 0;
    }

    /* Sidebar */
    .sidebar {
      background-color: #ffffff;
      height: 100vh;
      border-right: 1px solid #e5e7eb;
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      padding: 20px;
    }

    .sidebar h4 {
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 30px;
    }

    .sidebar .nav-link {
      color: #374151;
      font-weight: 500;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 10px 15px;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background-color: #3b82f6;
      color: white;
    }

    /* Main content */
    .main-content {
      margin-left: 240px;
      padding: 30px;
      background-color: #f9fafb;
      min-height: 100vh;
    }

    .page-title {
      font-weight: 600;
      font-size: 1.5rem;
      margin-bottom: 25px;
    }

    .table {
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .btn-primary {
      background-color: #3b82f6;
      border: none;
    }

    .btn-primary:hover {
      background-color: #2563eb;
    }
  </style>
</head>

<body>
  <!-- Sidebar -->
  <div class="sidebar">
    <h4>MediStock Pro</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a href="index.html" class="nav-link">Dashboard</a></li>
      <li class="nav-item"><a href="inventory.html" class="nav-link">Inventory</a></li>
      <li class="nav-item"><a href="billing.html" class="nav-link">Billing & Sales</a></li>
      <li class="nav-item"><a href="customers.html" class="nav-link">Customers</a></li>
      <li class="nav-item"><a href="notifications.html" class="nav-link active">Notifications</a></li>
      <li class="nav-item"><a href="reports.html" class="nav-link">Reports</a></li>
    </ul>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="page-title">Notifications</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addNotificationModal">+ Add Notification</button>
    </div>

    <!-- Table -->
    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Type</th>
          <th>Customer</th>
          <th>Message</th>
          <th>Status</th>
          <th>Sent At</th>
        </tr>
      </thead>
      <tbody id="notificationTableBody">
        <!-- Sample row -->
        <!--
        <tr>
          <td>Expiry Alert</td>
          <td>John Doe</td>
          <td>Medicine Paracetamol is expiring soon</td>
          <td>Sent</td>
          <td>2025-10-09</td>
        </tr>
        -->
      </tbody>
    </table>
  </div>

  <!-- Add Notification Modal -->
  <div class="modal fade" id="addNotificationModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Notification</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="notificationForm">
            <div class="mb-3">
              <label class="form-label">Notification Type</label>
              <input type="text" class="form-control" id="type" placeholder="Enter type (e.g. Expiry Alert)" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input type="text" class="form-control" id="customer" placeholder="Enter customer name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Message</label>
              <textarea class="form-control" id="message" rows="2" placeholder="Enter message" required></textarea>
            </div>
            <div class="mb-3">
              <label class="form-label">Status</label>
              <select class="form-select" id="status" required>
                <option value="">Select status</option>
                <option>Pending</option>
                <option>Sent</option>
              </select>
            </div>
            <div class="d-flex justify-content-end">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Notification</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- JS for Adding Notifications -->
  <script>
    document.getElementById("notificationForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const type = document.getElementById("type").value;
      const customer = document.getElementById("customer").value;
      const message = document.getElementById("message").value;
      const status = document.getElementById("status").value;
      const date = new Date().toISOString().split('T')[0];

      const tbody = document.getElementById("notificationTableBody");
      const newRow = tbody.insertRow();

      newRow.innerHTML = `
        <td>${type}</td>
        <td>${customer}</td>
        <td>${message}</td>
        <td>${status}</td>
        <td>${date}</td>
      `;

      // Reset & close
      document.getElementById("notificationForm").reset();
      const modal = bootstrap.Modal.getInstance(document.getElementById('addNotificationModal'));
      modal.hide();
    });
  </script>
</body>
</html>
