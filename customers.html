<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MediStock Pro - Customers</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Google Font -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      background-color: #f9fafb;
      font-family: 'Poppins', sans-serif;
    }

    /* Sidebar */
    .sidebar {
      background-color: #ffffff;
      height: 100vh;
      border-right: 1px solid #e5e7eb;
      position: fixed;
      top: 0;
      left: 0;
      width: 220px;
      padding: 20px;
    }

    .sidebar h4 {
      font-weight: 700;
      color: #3b82f6;
      margin-bottom: 30px;
    }

    .sidebar .nav-link {
      color: #374151;
      font-weight: 500;
      margin-bottom: 10px;
      border-radius: 8px;
      padding: 10px 15px;
    }

    .sidebar .nav-link:hover,
    .sidebar .nav-link.active {
      background-color: #3b82f6;
      color: white;
    }

    /* Main Content */
    .main-content {
      margin-left: 240px;
      padding: 30px;
      background-color: #f9fafb;
      min-height: 100vh;
    }

    .table {
      background-color: white;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
    }

    .btn-primary {
      background-color: #3b82f6;
      border: none;
    }

    .btn-primary:hover {
      background-color: #2563eb;
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <h4>MediStock Pro</h4>
    <ul class="nav flex-column">
      <li class="nav-item"><a href="index.html" class="nav-link">Dashboard</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Inventory</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Billing & Sales</a></li>
      <li class="nav-item"><a href="#" class="nav-link active">Customers</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Notifications</a></li>
      <li class="nav-item"><a href="#" class="nav-link">Reports</a></li>
    </ul>
  </div>

  <div class="main-content">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-semibold">Customers</h3>
      <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#addCustomerModal">+ Add Customer</button>
    </div>

    <table class="table table-hover align-middle" id="customerTable">
      <thead class="table-light">
        <tr>
          <th>Name</th>
          <th>Phone</th>
          <th>Email</th>
          <th>Address</th>
          <th>Member Since</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>John Doe</td>
          <td>9876543210</td>
          <td>john@example.com</td>
          <td>Chennai</td>
          <td>2025-10-09</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Add Customer Modal -->
  <div class="modal fade" id="addCustomerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Add New Customer</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="customerForm">
            <div class="mb-3">
              <label class="form-label">Customer Name</label>
              <input type="text" class="form-control" id="name" placeholder="Enter name" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phone" placeholder="Enter phone" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Email Address</label>
              <input type="email" class="form-control" id="email" placeholder="Enter email" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Address</label>
              <textarea class="form-control" id="address" rows="2" placeholder="Enter address" required></textarea>
            </div>
            <div class="d-flex justify-content-end">
              <button type="button" class="btn btn-secondary me-2" data-bs-dismiss="modal">Cancel</button>
              <button type="submit" class="btn btn-primary">Add Customer</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript for Dynamic Table -->
  <script>
    document.getElementById("customerForm").addEventListener("submit", function(e) {
      e.preventDefault();

      const name = document.getElementById("name").value;
      const phone = document.getElementById("phone").value;
      const email = document.getElementById("email").value;
      const address = document.getElementById("address").value;
      const date = new Date().toISOString().split('T')[0];

      const table = document.getElementById("customerTable").getElementsByTagName('tbody')[0];
      const newRow = table.insertRow();

      newRow.innerHTML = `
        <td>${name}</td>
        <td>${phone}</td>
        <td>${email}</td>
        <td>${address}</td>
        <td>${date}</td>
      `;

      // Reset form
      document.getElementById("customerForm").reset();
      // Close modal
      const modal = bootstrap.Modal.getInstance(document.getElementById('addCustomerModal'));
      modal.hide();
    });
  </script>
</body>
</html>
